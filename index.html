<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruang Baca - Login</title>
    <!-- Bootstrap 5.3.8 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* Kustomisasi warna agar persis seperti gambar */
        body {
            background-color: #f4f6f9; /* Warna abu-abu muda */
        }
        .navbar-custom {
            background-color: #198754; /* Hijau Bootstrap (success) */
        }
        .card-custom {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); /* Efek bayangan */
        }
        .btn-custom {
            background-color: #198754;
            border-color: #198754;
            font-weight: 500;
        }
        .btn-custom:hover {
            background-color: #157347;
            border-color: #146c43;
        }
    </style>
</head>
<body>

    <!-- 1. Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Ruang Baca</a>
            
            <!-- Tombol Hamburger untuk Mobile -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Menu Navigasi -->
            <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" href="#">Beranda</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Tentang</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Bantuan</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- 2. Form Login -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <!-- col-12 (mobile), col-md-8 (tablet), col-lg-5 (desktop) -->
            <div class="col-12 col-md-8 col-lg-5">
                <div class="card card-custom p-4">
                    <div class="card-body">
                        
                        <h3 class="text-center fw-bold mb-2">Masuk ke Ruang Baca</h3>
                        <p class="text-center text-muted mb-4">Temukan bacaan untuk hari ini.</p>
                        
                        <form>
                            <!-- Input Username -->
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" placeholder="Masukkan username">
                            </div>
                            
                            <!-- Input Password -->
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" placeholder="Masukkan password">
                            </div>
                            
                            <!-- Checkbox Ingat Saya -->
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="ingatSaya">
                                <label class="form-check-label" for="ingatSaya">Ingat saya</label>
                            </div>
                            
                            <!-- Tombol Masuk -->
                            <button type="submit" class="btn btn-custom w-100 text-white">Masuk</button>
                        </form>
                        
                        <!-- Tautan Lupa Password -->
                        <div class="text-center mt-3">
                            <a href="#" class="text-success text-decoration-none fw-bold">Lupa password?</a>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5.3.8 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
